<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Vinyl sticker outer drop shadow -->
    <filter id="vinylBorder" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.15" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.1" />
    </filter>
  </defs>

  <g filter="url(#vinylBorder)">
    <!-- 1. White outer die-cut border (stroke only) -->
    <path 
      d="M 52 23 C 55 17, 65 17, 68 23 L 107 88 C 110 93, 105 100, 99 100 L 21 100 C 15 100, 10 93, 13 88 Z" 
      fill="none" 
      stroke="#ffffff" 
      stroke-width="12" 
      stroke-linejoin="round" 
    />

    <!-- 2. Black filled triangle -->
    <path 
      d="M 52 23 C 55 17, 65 17, 68 23 L 107 88 C 110 93, 105 100, 99 100 L 21 100 C 15 100, 10 93, 13 88 Z" 
      fill="#1a1a1a" 
    />

    <!-- 3. Yellow inner triangle -->
    <path 
      d="M 54 35 C 56 31, 64 31, 66 35 L 95 84 C 97 88, 93 92, 88 92 L 32 92 C 27 92, 23 88, 25 84 Z" 
      fill="#ebd047" 
    />

    <!-- 4. Exclamation mark -->
    <!-- Upper bulbous part (thickened) -->
    <path 
      d="M 54 46 C 54 41, 66 41, 66 46 L 62.8 67 C 62.8 69.5, 57.2 69.5, 57.2 67 Z" 
      fill="#1a1a1a" 
    />
    <!-- Dot -->
    <circle cx="60" cy="78" r="4.8" fill="#1a1a1a" />
  </g>
</svg>
